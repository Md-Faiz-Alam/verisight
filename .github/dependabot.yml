# Weekly update pull requests, so dependencies and pinned actions do not drift.
version: 2
updates:
  # Minor and patch updates come as one pull request. Major versions of pandas,
  # DuckDB, sqlglot and the like change behaviour the SQL audit and loader rely
  # on, so they are upgraded by hand, with the full test suite and a live run.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    # Dependabot also bumps the Windows snapshot file past limits that other
    # packages set, which then fails "pip check". Remove an entry when its limit
    # moves: numpy is capped below 2.4 in pyproject.toml, and google-genai
    # accepts tenacity only below 9.2.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"
        versions: [">=2.4"]
      - dependency-name: "tenacity"
        versions: [">=9.2"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
