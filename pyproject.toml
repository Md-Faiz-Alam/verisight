[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "verisight"
version = "0.4.0"
description = "Ask questions about CSV, Excel and JSON files; every number is traced to the SQL result it came from."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["llm", "text-to-sql", "duckdb", "data-analysis", "verification", "gemini"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Typing :: Typed",
]

authors = [
    { name = "Md Faiz Alam" }
]

dependencies = [
    "duckdb>=2.0,<3.0",
    "google-genai>=2.27,<3.0",
    "numpy>=2.4.6,<2.5",
    "openpyxl>=3.1,<4.0",
    "pandas>=3.0,<4.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlglot>=30.33,<31.0",
    "xlrd>=2.0,<3.0",
]


[project.urls]
Homepage = "https://github.com/Md-Faiz-Alam/verisight"
Documentation = "https://github.com/Md-Faiz-Alam/verisight/tree/main/docs"
Issues = "https://github.com/Md-Faiz-Alam/verisight/issues"


[project.scripts]
verisight = "verisight.cli:main"
verisight-web = "verisight.web.__main__:main"


[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.18,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]
dev = [
    "fastapi>=0.115,<1.0",
    "httpx2>=2.0,<3.0",
    "python-multipart>=0.0.18,<1.0",
    "uvicorn>=0.30,<1.0",
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.11,<1.0",
    "mypy>=2.4,<3.0",
    "pandas-stubs>=3.0,<4.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
verisight = ["py.typed", "web/static/*", "web/static/assets/*", "web/demo/*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]


[tool.coverage.run]
branch = true
source = ["verisight"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]


[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "src/verisight",
    "tests",
]

# openpyxl ships no type information; only evaluation runners import it.
[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true