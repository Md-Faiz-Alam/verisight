[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "verisight"
version = "0.1.0"
description = "Autonomous, evidence-backed AI data analyst."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

authors = [
    { name = "Faiz" }
]

dependencies = [
    "duckdb>=1.4,<2.0",
    "google-genai>=2.27,<3.0",
    "numpy>=1.26,<2.4",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.2,<3.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "xlrd>=2.0,<3.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.11,<1.0",
    "mypy>=1.15,<2.0",
    "pandas-stubs>=2.2,<3.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
verisight = ["py.typed"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]


[tool.coverage.run]
branch = true
source = ["verisight"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]


[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "src/verisight",
    "tests",
]